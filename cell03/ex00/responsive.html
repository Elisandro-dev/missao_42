
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Define a codificação de caracteres para aceitar acentos -->
    <meta charset="UTF-8">

    <!-- Permite que a página se adapte a diferentes tamanhos de tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define o título que aparece na aba do navegador -->
    <title>Tabela Responsiva</title>

    <!-- Liga o arquivo CSS ao documento HTML -->
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <!-- Cria a tabela -->
    <table>
        <!-- Cria uma linha na tabela -->
        <tr>
            <!-- Primeira célula, com a classe usada para definir o estilo no CSS -->
            <td class="elisandro">Elisandro</td>

            <!-- Segunda célula, com a classe usada para definir o estilo no CSS -->
            <td class="varela">Varela</td>
        </tr>
    </table>
</body>
</html>
